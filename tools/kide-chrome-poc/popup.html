<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kide Reservation POC</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <main>
      <h1>Kide Reservation POC</h1>
      <label>Event ID or Kide event URL<input id="event" autocomplete="off" placeholder="https://kide.app/events/..."></label>
      <label>Exact variant name<input id="variant" autocomplete="off" placeholder="Jäsen"></label>
      <p id="status" role="status">Local-only. No reservation is made until final confirmation.</p>
      <div id="actions"><button id="find" type="button">Find ticket</button><button id="arm" type="button" disabled>Arm reservation</button></div>
      <section id="confirm" hidden><h2>READY</h2><p id="summary"></p><p>This will create a real temporary Kide reservation. No payment will be made.</p><div><button id="cancel" type="button">Cancel</button><button id="create" type="button" class="danger">Create real reservation</button></div></section>
    </main>
    <script src="helpers.js"></script><script src="popup.js"></script>
  </body>
</html>
